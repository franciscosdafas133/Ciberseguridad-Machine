<!--
  ===========================================================================
  Kriptome — agent.conf BASELINE (grupo 'kriptome-baseline')
  ===========================================================================
  Config compartida por todos los agentes. Se distribuye via grupos Wazuh.
  Aqui va el TUNING QUE PERTENECE AL AGENTE (no a reglas): que se monitorea,
  que ruido se ignora en origen, y opciones de FIM/Sysmon.
  ==
  REGLA: silenciar ruido de FIM a nivel de DIRECTORIO/REGEX se hace AQUI
  (soporta type="sregex"), NO en reglas. La whitelist de reglas (100030 +
  lista CDB) es solo para archivos exactos puntuales.
  ===========================================================================
-->
<agent_config>

  <!-- ===================== FIM / Syscheck ===================== -->
  <syscheck>
    <!-- Ignora PURO ruido operativo. NUNCA rutas sensibles. -->
    <ignore>/var/log/kriptome/heartbeat</ignore>
    <ignore type="sregex">\.swp$|\.tmp$|~$|/\.git/</ignore>

    <!-- Ejemplo de directorio critico monitoreado en tiempo real (Linux) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes" realtime="yes">/bin,/sbin,/usr/bin,/usr/sbin</directories>

    <!-- Ejemplo Windows (se aplica solo en agentes Windows) -->
    <directories check_all="yes" realtime="yes">%WINDIR%\System32\drivers\etc</directories>
  </syscheck>

  <!-- ===================== Notas de labels (v1.3.1) ====================
    Los labels de ASSET (asset_code, criticality_code) son POR AGENTE: van en
    el ossec.conf propio del agente (bloque <labels>), no aqui, porque cambian
    por endpoint. El label client_code SI puede ir en el agent.conf del grupo
    del cliente (ver CLI-001_agent.conf.example).

    CORRECCION v1.3.1 (identidad de tenant/cliente, ver
    specifications/tenant_identifier_migration.md):
      - client_id -> client_code (codigo visible, no clave tecnica)
      - asset_id (como label) -> asset_code (idem)
      - "asset_alias" (nombre de negocio, p.ej. "Servidor de facturacion")
        RETIRADO de las labels -- es PII/dato de negocio mutable, vive en
        specifications/asset_context.schema.json (CMDB), resuelto por
        backend a partir de asset_code. Las labels de Wazuh se limitan a
        CODIGOS operativos estables (ver specifications/wazuh_alert_field_paths.md).
      - criticality -> criticality_code

    Regla de seguridad (doc 03, actualizada): ningun agente productivo queda
    en 'default'; toda alerta debe traer client_code + asset_code, y el
    backend debe resolver tenant_id + asset_id reales contra el tenant/asset
    registry antes de procesar el evento (ver
    specifications/tenant_resolution.schema.json) -- las labels NUNCA son la
    frontera de seguridad por si solas.
  -->

</agent_config>
